<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #9a9a9a;
    --rule: #3a3a3a;
    --coral: #E5533D;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", "Inter", Helvetica, Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    align-items: center;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 64px 24px;
  }
  .rule { width: 1px; height: 260px; background: var(--rule); justify-self: center; }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    padding: 40px 24px;
    outline: none;
  }
  .lockup { display: flex; flex-direction: column; align-items: flex-start; }
  .mark { height: clamp(64px, 9vw, 104px); display: flex; align-items: center; }
  .gmt {
    font-size: clamp(72px, 9.6vw, 124px);
    font-weight: 200;
    letter-spacing: 0.02em;
    line-height: 1;
    display: flex;
    align-items: center;
    white-space: nowrap;
  }
  .gmt svg { width: 0.58em; height: 0.58em; margin: 0 0.06em 0 0.08em; flex: none; }
  .sprint { height: clamp(58px, 8vw, 100px); width: auto; display: block; }
  .line {
    margin: 22px 0 0;
    font-size: clamp(22px, 2.4vw, 34px);
    line-height: 1.12;
    letter-spacing: -0.01em;
    max-width: 12.5em;
    min-height: 2.24em;
  }
  .contact {
    margin-top: 44px;
    font-size: 17px;
    color: var(--muted);
    transition: color .2s ease;
  }
  .brand:hover .contact, .brand:focus-visible .contact { color: var(--fg); }
  .brand:focus-visible .lockup { outline: 1px solid var(--coral); outline-offset: 16px; }
  footer { padding: 0 24px 22px; max-width: 1680px; width: 100%; margin: 0 auto; font-size: 11px; color: #8a8a8a; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; padding: 40px 16px; gap: 0; }
    .rule { width: 120px; height: 1px; margin: 8px 0; }
    .brand { padding: 40px 8px; }
    .contact { margin-top: 28px; }
  }
</style>
